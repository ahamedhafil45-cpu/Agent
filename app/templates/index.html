<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova AI — Voice Assistant</title>
  <meta name="description" content="Speak a song name or ask Nova AI to draft an email. A voice-first assistant for quick commands.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #2a2633;
      --muted: #9a93a6;
      --sage: #a8c0a6;
      --sage-deep: #7c9c7a;
      --blush: #e6b6ad;
      --blush-deep: #d9a298;
      --cream: #f6f0e6;
      --surface: #ede8de;
      --line: #e2d9c8;
      --radius-xl: 40px;
      --radius-lg: 32px;
      --radius-md: 24px;
      --radius-sm: 16px;
    }

    * {
      box-sizing: border-box;
    }

    @keyframes clay-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    @keyframes halo {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 0.15; }
    }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--cream);
      color: var(--ink);
      font-family: "DM Sans", ui-sans-serif, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px;
    }

    @media (min-width: 640px) {
      header {
        padding: 20px 40px;
      }
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border-radius: 14px;
      background: var(--blush);
      color: var(--ink);
      box-shadow: 0 5px 0 0 var(--blush-deep);
      font-family: "DM Serif Display", Georgia, serif;
      font-size: 20px;
      line-height: 1;
    }

    .brand-name {
      font-family: "DM Serif Display", Georgia, serif;
      font-size: 20px;
    }

    .tagline {
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--muted);
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    @media (min-width: 640px) {
      main {
        padding: 40px 32px;
      }
    }

    .card {
      width: 100%;
      max-width: 48ch;
      background: var(--cream);
      border-radius: var(--radius-xl);
      box-shadow: 0 22px 45px -22px rgba(60, 52, 40, 0.55);
      border: 1px solid rgba(0, 0, 0, 0.05);
      padding: 48px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fade-up 0.6s ease-out both;
    }

    @media (min-width: 640px) {
      .card {
        padding: 48px 40px;
      }
    }

    .eyebrow {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.22em;
      color: var(--sage-deep);
    }

    h1 {
      font-family: "DM Serif Display", Georgia, serif;
      font-size: 32px;
      line-height: 1.1;
      text-align: center;
      max-width: 24ch;
      margin: 12px 0 0;
    }

    @media (min-width: 640px) {
      h1 {
        font-size: 40px;
      }
    }

    .subtitle {
      font-size: 16px;
      color: var(--muted);
      text-align: center;
      max-width: 40ch;
      margin-top: 12px;
      text-wrap: pretty;
    }

    .mic-wrap {
      position: relative;
      margin: 36px 0 12px;
    }

    .mic-halo {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: var(--sage);
      animation: halo 2.4s ease-in-out infinite;
    }

    .mic {
      position: relative;
      width: 112px;
      height: 112px;
      border: 0;
      border-radius: 50%;
      background: var(--sage);
      color: var(--ink);
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow:
        0 12px 0 0 var(--sage-deep),
        0 26px 34px -12px rgba(120, 150, 120, 0.6);
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      animation: clay-pulse 2.4s ease-in-out infinite;
    }

    .mic:active {
      transform: translateY(3px);
      box-shadow:
        0 6px 0 0 var(--sage-deep),
        0 13px 17px -6px rgba(120, 150, 120, 0.6);
    }

    .mic:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    @media (min-width: 640px) {
      .mic {
        width: 128px;
        height: 128px;
      }
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      padding: 6px 16px;
      border-radius: 999px;
      border: 1px solid rgba(0, 0, 0, 0.05);
      font-size: 14px;
      color: var(--ink);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
    }

    .status-dot.active {
      background: var(--sage-deep);
    }

    .command-box {
      width: 100%;
      margin-top: 28px;
      background: rgba(237, 232, 222, 0.7);
      border-radius: var(--radius-md);
      border: 1px solid rgba(0, 0, 0, 0.05);
      padding: 16px 20px;
      text-align: left;
      animation: fade-up 0.5s ease-out both;
    }

    .command-label {
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--muted);
    }

    .command-text {
      font-size: 16px;
      margin-top: 6px;
      color: var(--ink);
      text-wrap: pretty;
    }

    .editor {
      width: 100%;
      max-width: 48ch;
      margin-top: 20px;
      background: var(--cream);
      border-radius: var(--radius-lg);
      box-shadow: 0 22px 45px -22px rgba(60, 52, 40, 0.5);
      border: 1px solid rgba(0, 0, 0, 0.05);
      padding: 32px 28px;
      animation: fade-up 0.5s ease-out both;
    }

    @media (min-width: 640px) {
      .editor {
        padding: 32px 40px;
      }
    }

    .editor-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .editor-field {
      margin-top: 20px;
    }

    .editor-label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--muted);
    }

    .recipient-value {
      font-size: 16px;
      margin-top: 6px;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .badge {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      background: rgba(230, 182, 173, 0.6);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--ink);
    }

    input,
    textarea {
      width: 100%;
      margin-top: 6px;
      padding: 12px 16px;
      background: var(--surface);
      color: var(--ink);
      border: 1px solid rgba(0, 0, 0, 0.05);
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 16px;
      outline: none;
      transition: box-shadow 0.15s ease;
    }

    input::placeholder,
    textarea::placeholder {
      color: var(--muted);
    }

    input:focus,
    textarea:focus {
      box-shadow: 0 0 0 2px var(--sage-deep);
    }

    textarea {
      min-height: 130px;
      resize: vertical;
      line-height: 1.6;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 24px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 20px;
      border-radius: var(--radius-sm);
      border: 0;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.15s ease;
    }

    .btn-primary {
      background: var(--sage);
      color: var(--ink);
      box-shadow: 0 6px 0 0 var(--sage-deep);
    }

    .btn-primary:active {
      transform: translateY(3px);
      box-shadow: 0 3px 0 0 var(--sage-deep);
    }

    .btn-secondary {
      background: var(--surface);
      color: var(--ink);
      border: 1px solid rgba(0, 0, 0, 0.05);
    }

    .btn-secondary:hover {
      background: rgba(237, 232, 222, 0.8);
    }

    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px;
      font-size: 11px;
      color: var(--muted);
    }

    @media (min-width: 640px) {
      footer {
        padding: 20px 40px;
      }

      footer .hint {
        display: inline;
      }
    }

    footer .hint {
      display: none;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span class="brand-mark">N</span>
      <span class="brand-name">Nova AI</span>
    </div>
    <span class="tagline">Voice studio</span>
  </header>

  <main>
    <div class="card">
      <span class="eyebrow">Voice studio</span>
      <h1>Speak a command</h1>
      <p class="subtitle">Say a song to play, or ask Nova to draft an email for you.</p>

      <div class="mic-wrap">
        <span class="mic-halo" aria-hidden="true"></span>
        <button id="mic" class="mic" aria-label="Start listening">
          <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="3" width="6" height="12" rx="3"/>
            <path d="M5 11a7 7 0 0 0 14 0"/>
            <path d="M12 18v3"/>
          </svg>
        </button>
      </div>

      <div class="status-pill">
        <span id="status-dot" class="status-dot"></span>
        <span id="status">Tap microphone</span>
      </div>

      <div id="command-box" class="command-box" style="display: none;">
        <div class="command-label">Last command</div>
        <div id="command" class="command-text"></div>
      </div>
    </div>

    <div id="editor" class="editor" style="display: none;">
      <div class="editor-header">
        <div style="min-width: 0;">
          <div class="editor-label">To</div>
          <div id="recipient" class="recipient-value">Recipient not specified</div>
        </div>
        <span class="badge">Ready</span>
      </div>

      <div class="editor-field">
        <label class="editor-label" for="subject">Subject</label>
        <input id="subject" type="text" placeholder="Email subject">
      </div>

      <div class="editor-field">
        <label class="editor-label" for="body">Body</label>
        <textarea id="body" placeholder="Email body"></textarea>
      </div>

      <div class="actions">
        <button id="open" class="btn btn-primary">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 12h16"/>
            <path d="M14 6l6 6-6 6"/>
          </svg>
          Open in Gmail
        </button>
        <button id="regen" class="btn btn-secondary">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 11a8 8 0 1 0-2 6"/>
            <path d="M20 5v6h-6"/>
          </svg>
          Regenerate
        </button>
      </div>
    </div>
  </main>

  <footer>
    <span>Nova AI · voice assistant</span>
    <span class="hint">Say "create email" or "play a song"</span>
  </footer>

  <script>
    const $ = id => document.getElementById(id);
    const mic = $("mic");
    const status = $("status");
    const statusDot = $("status-dot");
    const commandBox = $("command-box");
    const commandText = $("command");
    const editor = $("editor");
    const recipient = $("recipient");
    const subject = $("subject");
    const body = $("body");

    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    let listening = false;
    let lastCommand = "";
    let emailGenerated = false;
    let generatingEmail = false;
    let youtubeTab = null;

    if (!SR) {
      status.textContent = "Speech recognition unavailable";
      mic.disabled = true;
    } else {
      recognition = new SR();
      recognition.lang = "en-US";
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        listening = true;
        statusDot.classList.add("active");
        mic.classList.remove("animate-clay-pulse");
        status.textContent = "Listening...";
      };

      recognition.onend = () => {
        listening = false;
        statusDot.classList.remove("active");
      };

      recognition.onerror = e => {
        listening = false;
        statusDot.classList.remove("active");
        status.textContent = "Voice error: " + e.error;
      };

      recognition.onresult = e => {
        const result = e.results[0]?.[0];
        const text = result?.transcript.trim() || "";
        if (!text) {
          status.textContent = "No command detected";
          return;
        }
        lastCommand = text;
        commandText.textContent = text;
        commandBox.style.display = "block";
        processCommand(text);
      };

      mic.onclick = () => {
        if (listening) return;
        try {
          recognition.start();
        } catch (e) {
          console.log(e);
        }
      };
    }

    function isGmail(command) {
      const hasCreate = /\bcreate\b/i.test(command);
      const hasEmail = /\bemail\b/i.test(command);
      return hasCreate && hasEmail;
    }

    function isYouTube(command) {
      return /\bplay\b/i.test(command) || /\bsong\b/i.test(command);
    }

    async function processCommand(command) {
      const gmail = isGmail(command);
      const youtube = isYouTube(command);

      if (gmail) {
        if (generatingEmail) {
          status.textContent = "Email is already being generated...";
          return;
        }
        if (emailGenerated && command === lastCommand) {
          status.textContent = "Email already generated.";
          return;
        }

        generatingEmail = true;
        status.textContent = "Generating email...";

        try {
          const response = await fetch("/agent", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ command })
          });
          const data = await response.json();

          if (!response.ok || !data.success) {
            throw new Error(data.message || "Email request failed");
          }

          showEmail(data);
          emailGenerated = true;
        } catch (error) {
          console.error(error);
          status.textContent = error.message || "Email generation failed";
        } finally {
          generatingEmail = false;
        }
        return;
      }

      if (youtube) {
        status.textContent = "Finding song...";
        try {
          const response = await fetch("/youtube/play", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ command })
          });
          const data = await response.json();

          if (!response.ok || !data.success) {
            throw new Error(data.message || "YouTube request failed");
          }

          playYouTube(data);
        } catch (error) {
          console.error(error);
          status.textContent = error.message || "YouTube request failed";
        }
        return;
      }

      status.textContent = "Please say 'create email' or 'play song'.";
    }

    function showEmail(data) {
      recipient.dataset.email = data.recipient || "";
      recipient.textContent = data.recipient
        ? "To: " + data.recipient
        : "Recipient not specified";
      subject.value = data.subject || "";
      body.value = data.body || "";
      editor.style.display = "block";
      status.textContent = "Email ready. Review or edit it.";
    }

    $("open").onclick = () => {
      const url = "https://mail.google.com/mail/u/0/?" + new URLSearchParams({
        view: "cm",
        fs: "1",
        to: recipient.dataset.email || "",
        su: subject.value,
        body: body.value
      });
      const win = window.open(url, "NovaGmail");
      if (!win) {
        status.textContent = "Please allow popups for this site.";
      }
    };

    $("regen").onclick = () => {
      status.textContent = "Email already generated. Edit the existing email.";
    };

    function playYouTube(data) {
      if (!youtubeTab || youtubeTab.closed) {
        youtubeTab = window.open(data.url, "NovaYouTube");
      } else {
        youtubeTab.location.href = data.url;
        youtubeTab.focus();
      }
      status.textContent = "Playing";
    }
  </script>
</body>
</html>
